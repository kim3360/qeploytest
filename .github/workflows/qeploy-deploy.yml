name: Qeploy Deploy to GitHub Pages

run-name: Qeploy deployment ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: 'Qeploy deployment correlation ID'
        required: false
        type: string
      checkout_ref:
        description: 'Git ref to checkout and build'
        required: false
        type: string

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          PAGES_JSON=$(curl -fsS \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" || true)
          CNAME=$(printf '%s' "$PAGES_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d||'{}');process.stdout.write(j.cname||'')}catch{}})")
          echo "cname=${CNAME}" >> $GITHUB_OUTPUT
          if [ "$REPO" = "${OWNER}.github.io" ] || [ -n "$CNAME" ]; then
            echo "path=/" >> $GITHUB_OUTPUT
            echo "base=" >> $GITHUB_OUTPUT
          else
            echo "path=/${REPO}/" >> $GITHUB_OUTPUT
            echo "base=/${REPO}" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx vite build --base=${{ steps.base.outputs.path }}
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          PUBLIC_URL: ${{ steps.base.outputs.path }}
          QEPLOY_BASE_PATH: ${{ steps.base.outputs.base }}

      - name: Resolve publish dir
        id: publish
        run: |
          DIR="./dist"
          echo "dir=$DIR" >> $GITHUB_OUTPUT
          echo "발행 대상: $DIR"

      - name: Verify build output
        run: |
          DIR="${{ steps.publish.outputs.dir }}"
          if [ ! -d "$DIR" ]; then
            echo "::error::빌드 산출물 디렉터리가 없습니다: $DIR"
            echo "빌드가 산출물을 다른 경로에 냈거나, 아무것도 만들지 않았습니다."
            exit 1
          fi
          if [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
            echo "::error::빌드 산출물 디렉터리가 비어 있습니다: $DIR"
            exit 1
          fi

      - name: Copy index.html to 404.html
        run: |
          [ -f ${{ steps.publish.outputs.dir }}/index.html ] && cp ${{ steps.publish.outputs.dir }}/index.html ${{ steps.publish.outputs.dir }}/404.html || true

      - name: Preserve custom domain
        run: |
          mkdir -p ${{ steps.publish.outputs.dir }}
          CNAME="${{ steps.base.outputs.cname }}"
          if [ -n "$CNAME" ]; then
            printf '%s\n' "$CNAME" > ${{ steps.publish.outputs.dir }}/CNAME
            echo "GitHub Pages custom domain CNAME 파일 생성 완료"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            if git fetch origin gh-pages --depth=1; then
              if git show FETCH_HEAD:CNAME > /tmp/qeploy-cname 2>/dev/null; then
                cp /tmp/qeploy-cname ${{ steps.publish.outputs.dir }}/CNAME
                echo "기존 CNAME 파일 보존 완료"
              else
                echo "기존 CNAME 파일 없음"
              fi
            else
              echo "gh-pages 브랜치 fetch 실패"
            fi
          else
            echo "gh-pages 브랜치 없음"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.publish.outputs.dir }}
